name: Tagged CLI release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?",os.environ["RELEASE_TAG"]), "Use a semver release tag"'
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and verify release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py "$RELEASE_TAG"
          python3 scripts/verify-release.py "dist/$RELEASE_TAG"
          cp install.sh install.ps1 "dist/$RELEASE_TAG/"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --target main --title "Lets Gen CLI $RELEASE_TAG" --generate-notes "${prerelease[@]}" "dist/$RELEASE_TAG/"*
